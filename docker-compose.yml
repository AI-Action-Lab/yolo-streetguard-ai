services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: streetguard
      POSTGRES_USER: streetguard
      POSTGRES_PASSWORD: streetguard
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetguard -d streetguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  storage:
    image: ghcr.io/mikeshanahan/locals3@sha256:33a900018990947924e166cd710a462113a94ec9294afe21138d1aa5e1a9ae01
    environment:
      MINIO_ROOT_USER: streetguard
      MINIO_ROOT_PASSWORD: streetguard
      LOCALS3_BUCKETS: streetguard-private
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/locals3", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - s3_data:/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    command: ["sh", "-c", "python -m streetguard.wait_for_database && alembic upgrade head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://streetguard:streetguard@database:5432/streetguard
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://streetguard:streetguard@database:5432/streetguard
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_SERVER_SIDE_ENCRYPTION: ${STORAGE_SERVER_SIDE_ENCRYPTION:-false}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STREETGUARD_API_PORT:-8000}:8000"

  worker:
    build:
      context: .
      target: inference
    command: celery -A streetguard.celery_app:celery_app worker --loglevel=INFO --queues=detection --concurrency=1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://streetguard:streetguard@database:5432/streetguard
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_SERVER_SIDE_ENCRYPTION: ${STORAGE_SERVER_SIDE_ENCRYPTION:-false}
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /models/pothole/best.pt
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/models:ro

  frontend:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
        NEXT_PUBLIC_MAP_SATELLITE_STYLE_URL: ${NEXT_PUBLIC_MAP_SATELLITE_STYLE_URL:-}
        NEXT_PUBLIC_MAP_TERRAIN_STYLE_URL: ${NEXT_PUBLIC_MAP_TERRAIN_STYLE_URL:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${STREETGUARD_WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  s3_data:
